name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  tag:
    name: Move major tag
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Move major tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git tag -f "${TAG%%.*}"
          git push -f origin "${TAG%%.*}"
