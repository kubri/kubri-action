name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm biome ci

      - name: Prettier
        run: pnpm prettier --check '**/*.{md,yml,yaml}'

      - name: Typecheck
        run: pnpm tsc

      - name: Build
        run: pnpm build

      - name: Check dist is up to date
        run: test -z "$(git status --porcelain dist)"
